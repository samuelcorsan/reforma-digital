<script>
  (() => {
    const tl = gsap.timeline({ paused: true });
    const byId = (id) => document.getElementById(id);
    const r = (i) => (((Math.sin(i * 12.9898) * 43758.5453) % 1) + 1) % 1;
    const seq = (t0, gap, n) => Array.from({ length: n }, (_, i) => t0 + i * gap);

    // Word entrance / exit (storyboard grammar)
    const wordIn = (el, t) =>
      tl.fromTo(el, { opacity: 0, y: 14, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.36, ease: "power3.out" }, t);
    const out = (els, t) =>
      tl.fromTo(els, { opacity: 1, y: 0, filter: "blur(0px)" }, { opacity: 0, y: -16, filter: "blur(8px)", duration: 0.28, ease: "power2.in", immediateRender: false }, t);

    // Word-by-word line that stays centered: x = half the width of the words not yet shown.
    // Widths are read lazily (function values) so they use the loaded font.
    const wordLine = (lineId, times) => {
      const line = byId(lineId);
      const words = Array.from(line.querySelectorAll(".hook-w"));
      const shift = (k) => () => (line.offsetWidth - (words[k].offsetLeft + words[k].offsetWidth)) / 2;
      words.forEach((w, i) => {
        wordIn(w, times[i]);
        if (i === 0) tl.set(line, { x: shift(0) }, times[0]);
        else tl.fromTo(line, { x: shift(i - 1) }, { x: shift(i), duration: 0.45, ease: "power3.out", immediateRender: false }, times[i]);
      });
    };

    // ---- Beat 1: tiny composer + I-beam click (0.0–0.8)
    const cam = byId("hook-cam");
    tl.fromTo("#hook-pill", { opacity: 0 }, { opacity: 1, duration: 0.45, ease: "power2.out" }, 0.05);
    tl.fromTo("#hook-ibeam", { x: 420, opacity: 0 }, { x: 0, opacity: 1, duration: 0.5, ease: "power2.inOut" }, 0.25);
    tl.fromTo("#hook-ibeam", { y: 260 }, { y: 0, duration: 0.5, ease: "power3.inOut" }, 0.25);
    tl.fromTo("#hook-ibeam", { scale: 1 }, { scale: 0.86, duration: 0.06, ease: "power2.in" }, 0.76);
    tl.fromTo("#hook-ibeam", { scale: 0.86 }, { scale: 1, duration: 0.1, ease: "power2.out", immediateRender: false }, 0.82);
    tl.fromTo("#hook-ring", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, 0.8);

    // ---- Beat 2: hard camera zoom into the input's left part (0.85–1.45)
    const PILL_L = -340, PAD = 100, ZOOM_X = 390;
    const measure = byId("hook-measure");
    const textEnd = () => PILL_L + PAD + measure.offsetWidth; // native x of the caret when typing is done
    const xType = () => Math.min(ZOOM_X, 1300 - textEnd());
    const appX = (k) => textEnd() + 14 + 56 + k * 258 + 115; // native centre of app tile k
    const xApps = () => 1800 - (appX(3) + 115); // 4th tile right edge at ~x 1800
    tl.fromTo("#hook-ibeam", { scale: 1, filter: "blur(0px)" }, { scale: 2.4, x: -260, opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power2.in", immediateRender: false }, 0.92);
    tl.fromTo(cam, { scale: 0.2, x: 0 }, { scale: 1, x: ZOOM_X, duration: 0.6, ease: "expo.inOut" }, 0.85);

    // ---- typing «Los asistentes de IA» at giant size (1.5–2.72), camera follows the caret
    const TXT = "Los asistentes de IA";
    const raw = [];
    let acc = 0;
    for (let i = 0; i < TXT.length; i++) {
      acc += 0.07 + 0.05 * r(i + 1) + (TXT[i - 1] === " " ? 0.06 : 0);
      raw.push(acc);
    }
    const K0 = 1.5, K1 = 2.72;
    const keyTimes = raw.map((v) => K0 + ((v - raw[0]) * (K1 - K0)) / (raw[raw.length - 1] - raw[0]));
    const typedEl = byId("hook-typed");
    const caretEl = byId("hook-caret");
    const drv = { t: 0 };
    tl.fromTo(drv, { t: 0 }, {
      t: 3.0, duration: 3.0, ease: "none",
      onUpdate: () => {
        const t = drv.t;
        let n = 0;
        while (n < keyTimes.length && t >= keyTimes[n]) n++;
        typedEl.textContent = TXT.slice(0, n);
        const typing = t >= K0 && t < K1 + 0.06;
        const on = t >= 0.8 && t < 2.82 && (typing || Math.floor((t - 0.8) / 0.3) % 2 === 0);
        caretEl.style.opacity = on ? "1" : "0";
      },
    }, 0);
    tl.set("#hook-placeholder", { opacity: 0 }, K0);
    tl.fromTo(cam, { x: ZOOM_X }, { x: xType, duration: K1 - K0 + 0.05, ease: "power1.inOut", immediateRender: false }, K0);

    // ---- four assistant tiles pop in after the text (2.82–3.52), camera pans to show them
    const bigApps = Array.from(document.querySelectorAll("#hook-apps .hook-app"));
    const popT = [2.82, 2.96, 3.1, 3.24];
    tl.fromTo(cam, { x: xType }, { x: xApps, duration: 0.72, ease: "power3.inOut", immediateRender: false }, 2.78);
    bigApps.forEach((a, k) => {
      tl.fromTo(a, { scale: 0.4, y: 30 }, { scale: 1, y: 0, duration: 0.28, ease: "back.out(1.7)" }, popT[k]);
      tl.fromTo(a, { opacity: 0 }, { opacity: 1, duration: 0.14, ease: "power2.out" }, popT[k]);
    });

    // ---- Beat 3: hard pull-back (3.56–4.21). The pill shrinks away; tiles and text hand off to
    // screen-space twins that fly from the exact zoomed positions to the headline layout.
    const PB = 3.56;
    tl.fromTo(cam, { scale: 1, x: xApps }, { scale: 0.42, x: 0, duration: 0.65, ease: "expo.inOut", immediateRender: false }, PB);
    tl.fromTo("#hook-pill", { opacity: 1 }, { opacity: 0, duration: 0.3, ease: "power2.out", immediateRender: false }, PB + 0.05);
    tl.set(bigApps, { opacity: 0 }, PB);
    tl.set(typedEl, { opacity: 0 }, PB);
    const minis = Array.from(document.querySelectorAll("#hook-minis .hook-app"));
    const miniX = [843, 921, 999, 1077], miniRot = [-7, -2, 3, 8];
    minis.forEach((m, k) => {
      tl.set(m, { opacity: 1 }, PB);
      tl.fromTo(m,
        { x: () => appX(k) + xApps() - miniX[k], y: 540 - 352, scale: 1, rotation: 0 },
        { x: 0, y: 0, scale: 64 / 230, rotation: miniRot[k], duration: 0.65, ease: "expo.inOut", immediateRender: false },
        PB);
    });
    const head = byId("hook-head");
    tl.set(head, { opacity: 1 }, PB);
    tl.fromTo(head,
      { x: () => PILL_L + PAD + xApps() - head.offsetLeft, y: 40, scale: 130 / 88 },
      { x: 0, y: 0, scale: 1, duration: 0.65, ease: "expo.inOut", immediateRender: false },
      PB);

    // ---- Beat 4: «prometían hacer tus trámites.»
    wordLine("hook-l2", [4.05, 4.21, 4.37, 4.56]);

    // ---- Beat 5: exit
    out(["#hook-head", "#hook-l2", "#hook-minis"], 5.2);

    // ---- Beat 6: «En cambio, te dan una lista de pasos.» + 9 chips piling up
    wordLine("hook-l6", seq(5.55, 0.11, 8));
    const chips = Array.from(document.querySelectorAll("#hook-chips .hook-chip"));
    const gaps = [0.22, 0.2, 0.19, 0.17, 0.15, 0.14, 0.13, 0.12];
    const chipT = [6.1];
    gaps.forEach((g) => chipT.push(chipT[chipT.length - 1] + g));
    const rot = chips.map((_, i) => (r(i + 21) * 2 - 1) * 4);
    const dimBlur = chips.map((_, i) => (i < 7 ? 1.5 + 3 * r(i + 41) : 0));
    const dimOp = chips.map((_, i) => (i < 7 ? 0.5 + 0.25 * r(i + 61) : 1));
    chips.forEach((c, i) => {
      // pop (back.out) on transforms only; focus/opacity on a non-overshooting ease (blur must never go negative)
      tl.fromTo(c,
        { scale: 0.82, y: 36, rotation: rot[i] * 2.5 },
        { scale: 1, y: 0, rotation: rot[i], duration: 0.42, ease: "back.out(1.5)" },
        chipT[i]);
      tl.fromTo(c, { opacity: 0, filter: "blur(10px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.3, ease: "power3.out" }, chipT[i]);
      if (i < 6) {
        // depth-of-field: older steps drift out of focus as new ones land on top
        tl.fromTo(c, { opacity: 1, filter: "blur(0px)" }, { opacity: dimOp[i], filter: `blur(${dimBlur[i]}px)`, duration: 0.25, ease: "power2.out", immediateRender: false }, chipT[i + 2]);
      }
    });
    // chip 9 «Vuelve a intentarlo» gets its own beat: the pile dims, it stays sharp and grows slightly
    const EMPH = 7.65;
    const emphOp = chips.map((_, i) => (i < 8 ? 0.45 : 1));
    const emphBlur = chips.map((_, i) => (i < 7 ? dimBlur[i] : i === 7 ? 2 : 0));
    const pile = chips.slice(0, 8);
    tl.fromTo(pile,
      { opacity: (i) => (i < 6 ? dimOp[i] : 1), filter: (i) => `blur(${i < 6 ? dimBlur[i] : 0}px)` },
      { opacity: (i) => emphOp[i], filter: (i) => `blur(${emphBlur[i]}px)`, duration: 0.35, ease: "power2.out", immediateRender: false },
      EMPH);
    tl.fromTo(document.querySelectorAll("#hook-chips .hook-pos")[8], { scale: 1 }, { scale: 1.04, duration: 0.35, ease: "power2.out" }, EMPH);
    out("#hook-l6", 8.3);
    tl.fromTo(chips,
      { opacity: (i) => emphOp[i], y: 0, filter: (i) => `blur(${emphBlur[i]}px)` },
      { opacity: 0, y: -16, filter: "blur(12px)", duration: 0.26, ease: "power2.in", stagger: 0.005, immediateRender: false },
      8.3);

    // ---- Beat 7: «Y se paran cuando toca de verdad.» + chat card
    wordLine("hook-l7", seq(8.6, 0.12, 7));
    tl.fromTo("#hook-card", { opacity: 0, y: 40, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }, 9.25);
    tl.fromTo("#hook-ask", { opacity: 0, y: 16, scale: 0.96 }, { opacity: 1, y: 0, scale: 1, duration: 0.36, ease: "power3.out" }, 9.65);
    document.querySelectorAll("#hook-replies .hook-reply").forEach((el, i) => {
      tl.fromTo(el, { opacity: 0, y: 10, filter: "blur(6px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.34, ease: "power3.out" }, 10.05 + i * 0.4);
    });
    out(["#hook-l7", "#hook-card"], 11.35);

    // ---- Beat 8: «Y para ayudarte, les das tus datos.» — fully visible ~12.63, held ≥2.0 s to 14.65
    const l8T = seq(11.55, 0.12, 7);
    wordLine("hook-l8", l8T);
    tl.fromTo("#hook-l8 .hook-tint", { scale: 0.88 }, { scale: 1, duration: 0.45, ease: "back.out(2.2)" }, l8T[6]);
    out("#hook-l8", 14.65);

    window.__timelines["hook"] = tl;
  })();
</script>
