<script>
  (() => {
    const tl = gsap.timeline({ paused: true });
    const wordIn = (el, t, d = 0.4) =>
      tl.fromTo(el, { opacity: 0, y: 14, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: d, ease: "power3.out" }, t);

    // ---- Beat 1: «Presentamos»
    wordIn("#reveal-intro", 0.05, 0.45);

    // ---- Beat 2: dock rises (0.2–0.7)
    tl.fromTo("#reveal-dock", { opacity: 0, y: 70, filter: "blur(6px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }, 0.2);
    tl.fromTo("#reveal-dock .reveal-mag > *", { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out", stagger: 0.03 }, 0.26);

    // ---- Beat 3: cursor glides to the app icon (0.6–1.22) with dock magnification, presses at 1.22, clicks at 1.3
    const GLIDE = 0.6, GLIDE_D = 0.62, CX = 960, CY = 677; // cursor tip lands on the magnified icon centre
    const exX = gsap.parseEase("power2.inOut"), exY = gsap.parseEase("power3.inOut");
    tl.fromTo("#reveal-cursor", { x: 700 }, { x: 0, duration: GLIDE_D, ease: exX }, GLIDE);
    tl.fromTo("#reveal-cursor", { y: 480 }, { y: 0, duration: GLIDE_D, ease: exY }, GLIDE);

    // Magnification, seek-safe: pure function of the glide progress (same eases as the cursor tweens).
    const slots = Array.from(document.querySelectorAll("#reveal-dock .reveal-slot, #reveal-dock .reveal-sep"));
    const items = slots.map((el) => ({ el, w: el.classList.contains("reveal-sep") ? 1 : 96, mag: el.querySelector(".reveal-mag") }));
    const GAP = 12, OURS = 5, bar = document.getElementById("reveal-bar");
    let base = 960 - 48 - OURS * (96 + GAP);
    items.forEach((it) => { it.c = base + it.w / 2; base += it.w + GAP; });
    const layout = (p) => {
      const cx = CX + 700 * (1 - exX(p));
      const cy = CY + 480 * (1 - exY(p));
      const hover = gsap.utils.clamp(0, 1, (830 - cy) / 70); // only while the pointer is over the dock
      const s = items.map((it) => (it.mag ? 1 + 0.45 * hover * Math.exp(-Math.pow(Math.abs(cx - it.c) / 126.9, 1.3)) : 1));
      const w = items.map((it, i) => it.w * s[i]);
      const left = [];
      left[OURS] = 960 - w[OURS] / 2; // the dock grows around our icon, which stays put
      for (let i = OURS - 1; i >= 0; i--) left[i] = left[i + 1] - GAP - w[i];
      for (let i = OURS + 1; i < items.length; i++) left[i] = left[i - 1] + w[i - 1] + GAP;
      items.forEach((it, i) => {
        it.el.style.transform = `translateX(${left[i] + w[i] / 2 - it.c}px)`;
        if (it.mag) it.mag.style.transform = `scale(${s[i]})`;
      });
      const last = items.length - 1;
      bar.style.left = `${left[0] - 11}px`;
      bar.style.width = `${left[last] + w[last] - left[0] + 22}px`;
    };
    layout(0);
    const glide = { p: 0 };
    tl.fromTo(glide, { p: 0 }, { p: 1, duration: GLIDE_D, ease: "none", onUpdate: () => layout(glide.p) }, GLIDE);

    tl.fromTo("#reveal-cursor", { scale: 1 }, { scale: 0.85, duration: 0.08, ease: "power2.in" }, 1.22);
    tl.fromTo("#reveal-cursor", { scale: 0.85 }, { scale: 1, duration: 0.16, ease: "power2.out", immediateRender: false }, 1.3);
    tl.fromTo("#reveal-app", { scale: 1 }, { scale: 0.9, duration: 0.08, ease: "power2.in" }, 1.22);
    tl.fromTo("#reveal-app", { scale: 0.9 }, { scale: 1, duration: 0.24, ease: "back.out(2)", immediateRender: false }, 1.3);
    tl.fromTo("#reveal-ripple", { opacity: 0.8, scale: 1 }, { opacity: 0, scale: 2.8, duration: 0.6, ease: "power2.out", immediateRender: false }, 1.3);
    // macOS launch bounce: ~40 px on screen (the icon sits inside the 1.45× magnifier) and down, 0.45 s; the running dot appears
    const BOUNCE = 1.32;
    tl.fromTo("#reveal-app", { y: 0 }, { y: -40 / 1.45, duration: 0.2, ease: "power2.out", immediateRender: false }, BOUNCE);
    tl.fromTo("#reveal-app", { y: -40 / 1.45 }, { y: 0, duration: 0.25, ease: "power2.in", immediateRender: false }, BOUNCE + 0.2);
    tl.fromTo("#reveal-app-dot", { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power2.out" }, BOUNCE + 0.1);

    // ---- Beat 4: sunset floods from the icon's center (1.55–2.15)
    tl.fromTo("#reveal-flood", { clipPath: "circle(0px at 960px 677px)" }, { clipPath: "circle(1250px at 960px 677px)", duration: 0.6, ease: "power3.inOut" }, 1.55);
    tl.set(["#reveal-intro", "#reveal-dock", "#reveal-cursor"], { opacity: 0 }, 2.15);

    // ---- Beat 5: logo + wordmark tracking reveal (1.9–3.2)
    tl.fromTo("#reveal-logo", { opacity: 0, scale: 0.8, filter: "blur(10px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.9, ease: "expo.out" }, 1.9);
    // tracking 0.35em → −0.04em, done with per-letter x offsets (transform only)
    const chars = Array.from(document.querySelectorAll("#reveal-word .reveal-ch"));
    const track = (0.35 + 0.04) * 190;
    const mid = (chars.length - 1) / 2;
    chars.forEach((c, i) => {
      tl.fromTo(c, { opacity: 0, x: (i - mid) * track, filter: "blur(16px)" }, { opacity: 1, x: 0, filter: "blur(0px)", duration: 1.3, ease: "expo.out" }, 1.92);
    });

    // ---- Beat 6: «La aplicación» (3.0–3.5)
    document.querySelectorAll("#reveal-mac .reveal-w").forEach((w, i) => wordIn(w, 3.0 + i * 0.14, 0.36));

    // ---- Beat 7: sun glow rises / breathes (1.9–4.5)
    tl.fromTo("#reveal-sun", { opacity: 0.4, scale: 1, y: 60 }, { opacity: 0.9, scale: 1.06, y: 0, duration: 2.6, ease: "sine.inOut" }, 1.9);

    window.__timelines["reveal"] = tl;
  })();
</script>
