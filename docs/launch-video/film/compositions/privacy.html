<script>
  const tl = gsap.timeline({ paused: true });
  const q = (s) => document.querySelector(s);
  const wordIn = (el, t) =>
    tl.fromTo(el, { opacity: 0, y: 14, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.36, ease: "power3.out" }, t);
  const exitAll = (els, t) =>
    tl.fromTo(els, { opacity: 1, y: 0, filter: "blur(0px)" }, { opacity: 0, y: -16, filter: "blur(8px)", duration: 0.25, ease: "power2.in", stagger: 0.015, immediateRender: false }, t);

  // Word widths from canvas text metrics: the slot is not laid out when the timeline is built.
  const ctx = document.createElement("canvas").getContext("2d");
  function wordW(el, px) {
    const svg = el.querySelector("svg");
    if (svg) return Number(svg.getAttribute("width"));
    ctx.font = `500 ${px}px "Geist"`;
    ctx.letterSpacing = `${-0.03 * px}px`;
    return ctx.measureText(el.textContent).width;
  }
  // x offset that keeps words 0..i centred while the full line is laid out centred (flex, gap 0.25em).
  function centredShifts(words, px) {
    const gap = 0.25 * px;
    const ws = words.map((w) => wordW(w, px));
    const total = ws.reduce((a, b) => a + b, 0) + gap * (ws.length - 1);
    let right = -gap;
    return ws.map((w) => {
      right += gap + w;
      return (total - right) / 2;
    });
  }
  // A centred line whose visible words stay centred as each new word arrives.
  function centredLine(lineSel, ids, times) {
    const words = ids.map(q);
    const shift = centredShifts(words, 88);
    tl.set(lineSel, { x: shift[0] }, 0);
    words.forEach((w, i) => {
      wordIn(w, times[i]);
      if (i > 0) tl.fromTo(lineSel, { x: shift[i - 1] }, { x: shift[i], duration: 0.42, ease: "power3.out", immediateRender: false }, times[i]);
    });
  }

  // Composer state is computed from tl.time() only (typing, caret, locks, scramble), so any seek is exact.
  const SIGNOS = "ABCDEFGHJKLMNPQRSTUVWXYZ0123456789#$%&*+=?";
  const PASOS = 16;
  const TYPE0 = 4.15;
  const PER_CHAR = 0.0235;
  const SCRAMBLE = 0.8;
  const SEGS = [
    { el: q("#privacy-s1"), t: "Soy " },
    { el: q("#privacy-d1"), t: "Lucía Martín", m: "{{nombre}}", s0: 6.05, key: q("#privacy-k1"), k0: 5.78 },
    { el: q("#privacy-s2"), t: ", " },
    { el: q("#privacy-s3"), t: "con DNI " },
    { el: q("#privacy-d2"), t: "12345678Z", m: "{{documento_numero}}", s0: 6.2, key: q("#privacy-k2"), k0: 5.93 },
    { el: q("#privacy-s4"), t: ". Renuévame el DNI." },
  ];
  const TOTAL = SEGS.reduce((n, s) => n + s.t.length, 0);
  const TYPE1 = TYPE0 + TOTAL * PER_CHAR;
  const caret = q("#privacy-caret");

  function scrambleText(de, a, paso) {
    const largo = Math.round(de.length + ((a.length - de.length) * paso) / PASOS);
    const fijas = Math.floor((a.length * paso) / PASOS);
    let out = "";
    for (let i = 0; i < largo; i++) out += i < fijas ? a[i] : SIGNOS[((Math.imul(i + 1, 0x9e3779b1) ^ Math.imul(paso + 1, 0x85ebca77)) >>> 0) % SIGNOS.length];
    return out;
  }
  function renderComposer() {
    const t = tl.time();
    let quedan = Math.max(0, Math.min(TOTAL, Math.floor((t - TYPE0) / PER_CHAR)));
    let caretAfter = SEGS[0].el;
    for (const s of SEGS) {
      const visible = s.t.slice(0, Math.max(0, quedan));
      if (quedan > 0) caretAfter = s.el;
      quedan -= s.t.length;
      let txt = visible;
      if (s.m) {
        const paso = Math.floor(((t - s.s0) / SCRAMBLE) * PASOS);
        const scrambling = t >= s.s0;
        if (scrambling) txt = paso >= PASOS ? s.m : paso <= 0 ? s.t : scrambleText(s.t, s.m, paso);
        s.el.classList.toggle("privacy-mono", scrambling);
        s.key.style.display = t >= s.k0 ? "inline-block" : "none";
      }
      if (s.el.textContent !== txt) s.el.textContent = txt;
    }
    if (caret.previousSibling !== caretAfter) caretAfter.after(caret);
    const typing = t < TYPE1 + 0.25;
    caret.style.opacity = typing && Math.floor((t - TYPE0) / 0.26) % 2 === 0 ? "1" : "0";
  }

  function build() {
    // Beat 1 — «Todo es [candado] privado.»
    centredLine("#privacy-l1", ["#privacy-l1a", "#privacy-l1b", "#privacy-l1c", "#privacy-l1d"], [0.1, 0.26, 0.44, 0.56]);
    tl.fromTo("#privacy-lock", { scale: 0.6 }, { scale: 1, duration: 0.45, ease: "back.out(2)" }, 0.44);
    exitAll(["#privacy-l1a", "#privacy-l1b", "#privacy-l1c", "#privacy-l1d"], 1.4);

    // Beat 2 — «Tus datos, cifrados en tu Mac.» + laptop drawing
    centredLine("#privacy-l2", ["#privacy-l2a", "#privacy-l2b", "#privacy-l2c", "#privacy-l2d", "#privacy-l2e", "#privacy-l2f"], [1.7, 1.84, 1.98, 2.12, 2.26, 2.4]);
    tl.fromTo("#privacy-laptop", { opacity: 0, y: 90 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 1.95);
    ["#privacy-screen", "#privacy-base", "#privacy-notch"].forEach((sel, i) => {
      const len = q(sel).getTotalLength() * 1.02;
      tl.fromTo(sel, { strokeDasharray: len, strokeDashoffset: len }, { strokeDashoffset: 0, duration: i === 0 ? 0.8 : 0.5, ease: "power2.out" }, 2.0 + i * 0.35);
    });
    tl.fromTo("#privacy-app", { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power1.out" }, 2.75);
    exitAll(["#privacy-l2a", "#privacy-l2b", "#privacy-l2c", "#privacy-l2d", "#privacy-l2e", "#privacy-l2f", "#privacy-laptop"], 3.4);

    // Beat 3 — «Tú escribes tus datos.», composer types, data locks into placeholders, headline swaps.
    const l3 = ["#privacy-l3a", "#privacy-l3b", "#privacy-l3c", "#privacy-l3d"];
    const l4 = ["#privacy-l4a", "#privacy-l4b", "#privacy-l4c", "#privacy-l4d", "#privacy-l4e"];
    centredLine("#privacy-l3", l3, [3.7, 3.82, 3.94, 4.06]);
    tl.fromTo("#privacy-card", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 3.85);
    SEGS.filter((s) => s.m).forEach((s) => {
      tl.fromTo(s.key, { scale: 0.4, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.35, ease: "back.out(2.2)" }, s.k0);
      tl.fromTo(s.el, { backgroundColor: "rgba(223, 23, 23, 0)", color: "#0a0a0a" }, { backgroundColor: "rgba(223, 23, 23, 0.10)", color: "#df1717", duration: 0.2, ease: "power1.out" }, s.k0 + 0.04);
      tl.fromTo(s.el, { backgroundColor: "rgba(223, 23, 23, 0.10)", color: "#df1717" }, { backgroundColor: "rgba(255, 190, 11, 0.25)", color: "#0a0a0a", duration: 0.25, ease: "power1.out", immediateRender: false }, s.s0 + SCRAMBLE);
    });
    tl.fromTo("#privacy-note", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 6.95);
    tl.fromTo(l3, { opacity: 1, y: 0, filter: "blur(0px)" }, { opacity: 0, y: -12, filter: "blur(8px)", duration: 0.16, ease: "power2.in", immediateRender: false }, 6.95);
    tl.fromTo(l4, { opacity: 0, y: 12, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.32, ease: "power3.out", stagger: 0.05 }, 7.08);
    exitAll([...l4, "#privacy-card", "#privacy-note"], 9.1);

    tl.eventCallback("onUpdate", renderComposer);
    renderComposer();
    window.__timelines["privacy"] = tl;
    if (window.__hfForceTimelineRebind) window.__hfForceTimelineRebind();
  }

  Promise.all([document.fonts.load('500 88px "Geist"'), document.fonts.load('400 42px "Geist"'), document.fonts.load('400 38px "Geist Mono"'), document.fonts.ready]).then(build);
</script>
