<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Reforma Digital</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=block"
    />
    <style>
      :root {
        --rojo: #df1717;
        --doblez: #a50e0e;
        --naranja: #ff7a1a;
        --amarillo: #ffbe0b;
        --tinta: #222222;
        --tinta-3: #6b6b6b;
        --blanco: #ffffff;
        --linea: rgba(0, 0, 0, 0.1);
        --font-titular: Georgia, serif;
        --font-texto: 'Geist', ui-sans-serif, system-ui, sans-serif;
        --font-mono: 'Geist Mono', ui-monospace, monospace;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        font-family: var(--font-texto);
        color: var(--blanco);
        background: var(--rojo);
        -webkit-font-smoothing: antialiased;
      }
      main {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background:
          radial-gradient(
            70% 60% at 78% 120%,
            rgba(255, 122, 26, 0.55) 0%,
            rgba(223, 23, 23, 0) 70%
          ),
          radial-gradient(60% 80% at 0% 0%, rgba(165, 14, 14, 0.45) 0%, rgba(165, 14, 14, 0) 60%),
          var(--rojo);
      }

      /* El sol: un disco que sube desde abajo, con halos concéntricos. */
      .sol {
        position: absolute;
        left: var(--sol-x);
        top: var(--sol-y);
        width: var(--sol-d);
        height: var(--sol-d);
        border-radius: 50%;
        transform: translate(-50%, -50%);
        background: radial-gradient(
          circle at 50% 38%,
          #fff3c4 0%,
          #ffd34d 22%,
          var(--amarillo) 46%,
          var(--naranja) 82%,
          #f2551a 100%
        );
      }
      .resplandor {
        position: absolute;
        inset: 0;
        background: radial-gradient(
          circle at var(--sol-x) var(--sol-y),
          rgba(255, 190, 11, 0.55) 0,
          rgba(255, 122, 26, 0.35) calc(var(--sol-d) / 2 + 20px),
          rgba(255, 122, 26, 0) calc(var(--sol-d) / 2 + 240px)
        );
      }
      .halos {
        position: absolute;
        inset: 0;
        background: repeating-radial-gradient(
          circle at var(--sol-x) var(--sol-y),
          rgba(255, 255, 255, 0) 0 calc(var(--sol-d) / 2 + 38px),
          rgba(255, 255, 255, 0.1) calc(var(--sol-d) / 2 + 38px) calc(var(--sol-d) / 2 + 39.5px),
          rgba(255, 255, 255, 0) calc(var(--sol-d) / 2 + 39.5px) calc(var(--sol-d) / 2 + 76px)
        );
        -webkit-mask-image: radial-gradient(
          circle at var(--sol-x) var(--sol-y),
          #000 0,
          #000 calc(var(--sol-d) / 2 + var(--halos-alcance, 260px)),
          transparent calc(var(--sol-d) / 2 + var(--halos-alcance, 260px) + 70px)
        );
      }

      header {
        position: absolute;
        top: 48px;
        left: 64px;
        right: 64px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .marca {
        display: flex;
        align-items: center;
        gap: 14px;
        font-size: 25px;
        font-weight: 700;
        line-height: 0.95;
        letter-spacing: -0.02em;
      }
      .dato {
        font-family: var(--font-mono);
        font-size: 15px;
        font-weight: 500;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .copia {
        position: absolute;
        left: 64px;
        top: 138px;
        width: 590px;
      }
      .etiqueta {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 26px;
        font-size: 18px;
        letter-spacing: 0.02em;
        text-transform: none;
        color: rgba(255, 255, 255, 0.86);
      }
      .etiqueta::before {
        content: '';
        width: 28px;
        height: 2px;
        background: currentColor;
      }
      h1 {
        font-family: var(--font-titular);
        font-size: 74px;
        font-weight: 400;
        line-height: 1.02;
        letter-spacing: -0.025em;
        text-wrap: balance;
      }
      .texto {
        margin-top: 22px;
        font-size: 26px;
        line-height: 1.42;
        text-wrap: pretty;
        color: rgba(255, 255, 255, 0.9);
      }

      footer {
        position: absolute;
        left: 64px;
        bottom: 46px;
        display: flex;
        gap: 22px;
        color: rgba(255, 255, 255, 0.78);
      }
      footer span + span::before {
        content: '·';
        margin-right: 22px;
      }

      /* La R nunca va sobre amarillo: queda sobre rojo, con un módulo de aire hasta el sol. */
      [data-escena='marca'] main {
        --sol-x: 930px;
        --sol-y: 720px;
        --sol-d: 520px;
        --halos-alcance: 80px;
      }
      .escena {
        position: absolute;
        display: none;
      }
      [data-escena='marca'] .simbolo {
        display: block;
      }

      /* Escena de portada: como el hero, centrada sobre el atardecer, con los proyectos debajo. */
      [data-escena='portada'] main {
        background:
          radial-gradient(46% 30% at 50% 112%, #fff1b8 0%, rgba(255, 211, 77, 0) 70%),
          radial-gradient(
            95% 62% at 50% 122%,
            #ffd34d 0%,
            var(--amarillo) 22%,
            var(--naranja) 46%,
            rgba(223, 23, 23, 0) 80%
          ),
          var(--rojo);
      }
      [data-escena='portada'] :is(.sol, .resplandor, .etiqueta, footer) {
        display: none;
      }
      [data-escena='portada'] .halos {
        background: repeating-radial-gradient(
          circle at 50% 122%,
          rgba(255, 255, 255, 0) 0 118px,
          rgba(255, 255, 255, 0.07) 118px 119px
        );
        -webkit-mask-image: linear-gradient(180deg, transparent 18%, #000 70%);
      }
      [data-escena='portada'] .copia {
        left: 0;
        right: 0;
        top: 158px;
        width: auto;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
      }
      [data-escena='portada'] h1 {
        max-width: 900px;
        font-size: 86px;
        line-height: 1.04;
        letter-spacing: -0.02em;
      }
      [data-escena='portada'] .texto {
        max-width: 44ch;
        margin-top: 24px;
        font-size: 30px;
        line-height: 1.4;
        text-wrap: balance;
      }
      [data-escena='portada'] :is(.codigo, .proyectos) {
        display: flex;
      }
      .codigo {
        position: static;
        align-items: center;
        gap: 10px;
        height: 44px;
        padding: 0 20px;
        border: 1px solid rgba(255, 255, 255, 0.4);
        border-radius: 999px;
        font-size: 19px;
        font-weight: 500;
      }
      .proyectos {
        left: 0;
        right: 0;
        bottom: 48px;
        justify-content: center;
        gap: 12px;
        list-style: none;
      }
      .proyectos li {
        display: flex;
        align-items: center;
        gap: 10px;
        height: 52px;
        padding: 0 22px;
        border-radius: 999px;
        background: var(--blanco);
        box-shadow: 0 10px 30px rgba(165, 14, 14, 0.25);
        font-size: 20px;
        font-weight: 500;
        color: var(--tinta);
      }
      .proyectos span {
        font-size: 16px;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
        color: var(--rojo);
      }

      /* Escena de marca: la R sale del sol. */
      .simbolo {
        left: 930px;
        top: 232px;
        transform: translate(-50%, -50%);
      }
      /* El Congreso y Elecciones (DESIGN.md §8.7): página blanca y el sol pixelado, nunca bajo texto. */
      [data-escena='horizonte'] {
        color: var(--tinta);
      }
      [data-escena='horizonte'] main {
        background: var(--blanco);
      }
      [data-escena='horizonte'] :is(.sol, .resplandor, .halos, footer) {
        display: none;
      }
      [data-escena='horizonte'] .etiqueta {
        color: var(--rojo);
      }
      [data-escena='horizonte'] .texto {
        max-width: 46ch;
        color: var(--tinta-3);
        text-wrap: balance;
      }
      [data-escena='horizonte'] .horizonte {
        display: block;
        left: 50%;
        bottom: 0;
        width: calc(360 * 6px);
        height: calc(32 * 6px);
        transform: translateX(-50%);
        image-rendering: pixelated;
      }
      [data-escena='horizonte'] .copia {
        left: 0;
        right: 0;
        top: 150px;
        width: auto;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
      }
      [data-escena='horizonte'] h1 {
        max-width: 960px;
      }
    </style>
  </head>
  <body data-escena="portada">
    <main>
      <div class="resplandor" aria-hidden="true"></div>
      <div class="sol" aria-hidden="true"></div>
      <div class="halos" aria-hidden="true"></div>

      <header>
        <span class="marca">
          <svg width="40" height="54" viewBox="0 0 144 192" aria-hidden="true">
            <path fill="currentColor" d="M48 0H96V48H48V96H96V144H48V192H0V48H48Z" />
            <path fill="var(--doblez)" d="M0 48L48 0V48Z" />
            <rect x="96" y="48" width="48" height="48" fill="currentColor" />
            <rect x="96" y="144" width="48" height="48" fill="currentColor" />
          </svg>
          <span>Reforma<br />Digital</span>
        </span>
        <span class="escena codigo">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path
              d="M12 .5C5.65.5.5 5.65.5 12a11.5 11.5 0 0 0 7.86 10.92c.58.1.79-.25.79-.56v-2c-3.2.7-3.87-1.37-3.87-1.37-.53-1.33-1.28-1.69-1.28-1.69-1.05-.72.08-.7.08-.7 1.16.08 1.77 1.19 1.77 1.19 1.03 1.77 2.7 1.26 3.36.96.1-.75.4-1.26.73-1.55-2.56-.29-5.25-1.28-5.25-5.7 0-1.26.45-2.29 1.19-3.1-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.17 1.18a11 11 0 0 1 5.77 0c2.2-1.49 3.17-1.18 3.17-1.18.63 1.59.23 2.76.11 3.05.74.81 1.19 1.84 1.19 3.1 0 4.43-2.7 5.4-5.27 5.69.41.36.78 1.06.78 2.14v3.17c0 .31.21.67.8.56A11.5 11.5 0 0 0 23.5 12C23.5 5.65 18.35.5 12 .5Z"
            />
          </svg>
          Código abierto
        </span>
      </header>

      <div class="copia">
        <p class="etiqueta dato" id="etiqueta">Iniciativa abierta</p>
        <h1 id="titular">Lo público, a la altura de las personas.</h1>
        <p class="texto" id="texto">
          Herramientas y propuestas para una Administración más clara, accesible y sencilla.
        </p>
      </div>

      <ul class="escena proyectos">
        <li><span>01</span>Extensión para Chrome</li>
        <li><span>02</span>El Congreso</li>
      </ul>

      <svg class="escena simbolo" width="168" height="224" viewBox="0 0 144 192" aria-hidden="true">
        <path fill="var(--blanco)" d="M48 0H96V48H48V96H96V144H48V192H0V48H48Z" />
        <path fill="var(--doblez)" d="M0 48L48 0V48Z" />
        <rect x="96" y="48" width="48" height="48" fill="var(--blanco)" />
        <rect x="96" y="144" width="48" height="48" fill="var(--blanco)" />
      </svg>

      <img class="escena horizonte" src="../public/congreso/sol-horizonte.png" alt="" />

      <footer class="dato">
        <span>Código abierto</span>
        <span>Hecho en comunidad</span>
      </footer>
    </main>
  </body>
</html>
