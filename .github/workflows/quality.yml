name: Quality
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full:
        description: Run all 150 cases
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  deterministic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
  live-regression:
    # Configure repository variable LIVE_EVALS_ENABLED after human approval of golden and baseline.
    # Never use pull_request_target: untrusted PR code must not receive production secrets.
    if: vars.LIVE_EVALS_ENABLED == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    environment: evaluations
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Compare web search results with approved baseline
        env:
          DATABASE_URL: ${{ secrets.EVAL_DATABASE_URL }}
          NAN_API_KEY: ${{ secrets.NAN_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
        run: pnpm eval --mode live --dataset ${{ inputs.full && 'full' || 'golden' }} --judges --compare baseline --ci
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: eval-reports
          path: artifacts/runs/
