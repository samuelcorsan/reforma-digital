name: Check and package
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: pnpm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/ingestion/requirements.txt
      - run: python -m pip install -r apps/ingestion/requirements.txt
      - run: python -m pytest -p no:cacheprovider apps/ingestion/tests
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm check
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: node scripts/package.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: reforma-digital-extension
          path: artifacts/*.zip
  desktop:
    # La app de escritorio compilada (Electron, detector local y capas de privacidad) con un
    # proveedor simulado: tests/e2e/escritorio.spec.ts. En macOS, con el llavero de prueba.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @reforma-digital/desktop exec install-electron
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: packages/agent/.cache/rampart-edge
          key: detector-${{ hashFiles('packages/agent/scripts/detector.mjs') }}
      - run: pnpm --filter @reforma-digital/agent detector
      - run: pnpm --filter @reforma-digital/desktop build
      - run: pnpm exec playwright test tests/e2e/escritorio.spec.ts
        env:
          RD_ESCRITORIO: '1'
