# Posts or updates one PR comment linking the visual-qa artifact. Runs from the default branch
# with write access, so it never checks out or executes the PR's code: it only reads the run's
# artifact list and checks that the PR number in the artifact name matches the run's commit.
name: Visual QA comment
on:
  workflow_run:
    workflows: [Visual QA]
    types: [completed]
permissions:
  actions: read
  pull-requests: write
jobs:
  comment:
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const { owner, repo } = context.repo;
            const { data } = await github.rest.actions.listWorkflowRunArtifacts({ owner, repo, run_id: run.id });
            const artifact = data.artifacts.find((a) => /^visual-qa-pr-\d+$/.test(a.name));
            if (!artifact) return core.info('No visual-qa artifact in this run.');
            const number = Number(artifact.name.slice('visual-qa-pr-'.length));
            // The artifact name comes from the PR's workflow file: only trust it if that PR is at this commit.
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: number });
            if (pr.head.sha !== run.head_sha) return core.info(`PR #${number} is not at ${run.head_sha}.`);

            const marker = '<!-- visual-qa -->';
            const body = [
              marker,
              '### Visual QA',
              '',
              `Capturas (1280 y 390 px) de las pantallas que toca esta PR en el commit ${run.head_sha.slice(0, 7)}. Las páginas de \`apps/web\` incluyen además un vídeo con scroll.`,
              '',
              `- [Descargar el zip](https://github.com/${owner}/${repo}/actions/runs/${run.id}/artifacts/${artifact.id}) (caduca en 14 días)`,
              `- [Ver el run y la lista de pantallas](${run.html_url})`,
              ...(run.conclusion === 'success' ? [] : ['', '⚠️ Algún paso ha fallado: puede que falten capturas.']),
            ].join('\n');
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: number });
            const previous = comments.find((c) => c.user?.type === 'Bot' && c.body?.startsWith(marker));
            if (previous) await github.rest.issues.updateComment({ owner, repo, comment_id: previous.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number: number, body });
