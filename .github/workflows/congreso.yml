name: Actualizar los datos del Congreso
on:
  schedule:
    - cron: '17 5 * * 1-6'
    - cron: '40 6,19 * * *'
  workflow_dispatch:
    inputs:
      command:
        description: Trabajo (bootstrap solo en una instalación vacía)
        type: choice
        options:
          [update, polls, bootstrap, reanalyze, rebuild, geography, elections, promises, reparse]
        default: update
      limit:
        description: Máximo de llamadas a NaN (1–5000)
        default: '100'
      since:
        description: Reanalizar desde esta fecha (AAAA-MM-DD; vacío para todo)
        required: false
permissions:
  contents: read
concurrency:
  group: congreso-ingestion
  cancel-in-progress: false
jobs:
  ingest:
    if: github.event_name == 'workflow_dispatch' || vars.CONGRESS_INGESTION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    # Los secretos van solo en los pasos que los usan, no durante las instalaciones.
    env:
      NAN_MODEL: ${{ vars.NAN_MODEL || 'deepseek-v4-flash' }}
      COMMAND: ${{ inputs.command || (github.event.schedule == '17 5 * * 1-6' && 'update' || 'polls') }}
      LIMIT: ${{ inputs.limit || '100' }}
      SINCE: ${{ inputs.since }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: pnpm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/ingestion/requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: pnpm install --frozen-lockfile
      - run: python -m pip install -r apps/ingestion/requirements.txt
      - name: Comprobar credenciales sin mostrarlas
        env:
          DATABASE_URL: ${{ secrets.CONGRESS_DATABASE_URL }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          NAN_API_KEY: ${{ secrets.NAN_API_KEY }}
        run: |
          test -n "$DATABASE_URL"
          test -n "$BLOB_READ_WRITE_TOKEN"
          test -n "$NAN_API_KEY"
      - name: Recoger, analizar y publicar en Postgres y Blob
        # El contexto `runner` solo existe dentro de los pasos, no en el `env` del job.
        env:
          DATABASE_URL: ${{ secrets.CONGRESS_DATABASE_URL }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          NAN_API_KEY: ${{ secrets.NAN_API_KEY }}
          CONGRESS_WORKDIR: ${{ runner.temp }}/congreso
        run: |
          args=("$COMMAND" --limit "$LIMIT")
          if [ -n "$SINCE" ]; then args+=(--since "$SINCE"); fi
          python apps/ingestion/run.py "${args[@]}"
