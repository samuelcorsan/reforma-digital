name: Desktop release
# Al subir una etiqueta escritorio-v<versión>, cada sistema empaqueta sus instaladores (Electron se
# empaqueta en el suyo) y se publican juntos en la release de esa etiqueta.
on:
  push:
    tags: ['escritorio-v*']
permissions:
  contents: read
jobs:
  package:
    strategy:
      matrix:
        # macOS 26 trae Xcode 26, que pide el icono de Icon Composer.
        os: [macos-26, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @reforma-digital/desktop exec install-electron
      - run: pnpm --filter @reforma-digital/agent detector
      - run: pnpm --filter @reforma-digital/desktop build
      - run: pnpm --filter @reforma-digital/desktop exec electron-builder --config electron-builder.json --publish never
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: escritorio-${{ matrix.os }}
          if-no-files-found: error
          path: |
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.deb
            apps/desktop/dist/*.AppImage
  release:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: instaladores
          merge-multiple: true
      - run: gh release create "$GITHUB_REF_NAME" instaladores/* --title "Reforma Digital para escritorio ${GITHUB_REF_NAME#escritorio-v}" --notes-file .github/desktop-release-notes.md
        env:
          GH_TOKEN: ${{ github.token }}
