# Change to a globally unique app name before deploying.
app = "replace-with-your-unique-reforma-mcp-name"
primary_region = "mad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  HOST = "0.0.0.0"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    soft_limit = 60
    hard_limit = 120

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
